apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.data.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-docker
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.docker.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.docker.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        naslos.io/env-checksum: {{ .Values.naslosEnvChecksum | default "" | quote }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: naslos-env-{{ .Release.Name }}, optional: true }
          securityContext:
            privileged: true
          env:
            - { name: TZ, value: "{{ .Values.timezone }}" }
            - { name: GITEA_INSTANCE_URL, value: "{{ .Values.instanceUrl }}" }
            - { name: GITEA_RUNNER_REGISTRATION_TOKEN, value: "{{ .Values.registrationToken }}" }
            - { name: GITEA_RUNNER_NAME, value: "{{ .Values.runnerName }}" }
            - { name: GITEA_RUNNER_LABELS, value: "{{ .Values.runnerLabels }}" }
            {{- if .Values.ephemeral }}
            - { name: GITEA_RUNNER_EPHEMERAL, value: "1" }
            {{- end }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: docker, mountPath: /var/lib/docker }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: docker
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-docker
