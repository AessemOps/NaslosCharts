apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.config.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.config.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: {{ .Values.pgid }}
      {{- if .Values.vuetorrent }}
      initContainers:
        - name: vuetorrent-install
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cd /tmp
              wget -qO vuetorrent.zip https://github.com/VueTorrent/VueTorrent/releases/latest/download/vuetorrent.zip
              unzip -q vuetorrent.zip
              cp -a vuetorrent/. /vuetorrent/
          volumeMounts:
            - { name: vuetorrent, mountPath: /vuetorrent }
      {{- end }}
      containers:
        - name: gluetun
          image: "{{ .Values.vpnImage }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - { name: VPN_SERVICE_PROVIDER, value: "{{ .Values.vpn_provider }}" }
            - { name: VPN_TYPE, value: "{{ .Values.vpn_type }}" }
            - { name: SERVER_COUNTRIES, value: "{{ .Values.vpn_serverCountries }}" }
            - { name: WIREGUARD_PRIVATE_KEY, value: "{{ .Values.vpn_wireguardPrivateKey }}" }
            - { name: WIREGUARD_ADDRESSES, value: "{{ .Values.vpn_wireguardAddresses }}" }
            - { name: OPENVPN_USER, value: "{{ .Values.vpn_openvpnUser }}" }
            - { name: OPENVPN_PASSWORD, value: "{{ .Values.vpn_openvpnPassword }}" }
            - { name: FIREWALL_OUTBOUND_SUBNETS, value: "{{ .Values.vpn_firewallOutboundSubnets }}" }
            - { name: FIREWALL_INPUT_PORTS, value: "8000,{{ .Values.webuiPort }}" }
            - { name: TZ, value: "{{ .Values.timezone }}" }
          volumeMounts:
            - { name: tun, mountPath: /dev/net/tun }
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 15
        - name: qbittorrent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: PUID, value: "{{ .Values.puid }}" }
            - { name: PGID, value: "{{ .Values.pgid }}" }
            - { name: TZ, value: "{{ .Values.timezone }}" }
            - { name: WEBUI_PORT, value: "{{ .Values.webuiPort }}" }
            - { name: VUETORRENT_ENABLED, value: "{{ .Values.vuetorrent }}" }
            - { name: USE_CATEGORY_PATHS_IN_MANUAL_MODE, value: "{{ .Values.useCategoryPathsInManualMode }}" }
          ports:
            - { name: http, containerPort: {{ .Values.webuiPort }} }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: vuetorrent-init, mountPath: /custom-cont-init.d }
            {{- if .Values.vuetorrent }}
            - { name: vuetorrent, mountPath: /vuetorrent }
            {{- end }}
            {{- if .Values.datasets }}
            {{- range .Values.datasets }}
            - { name: ds-{{ .name }}, mountPath: {{ .mountPath }} }
            {{- end }}
            {{- else }}
            - { name: data, mountPath: /data }
            {{- end }}
          readinessProbe:
            tcpSocket: { port: {{ .Values.webuiPort }} }
            initialDelaySeconds: 20
            periodSeconds: 20
          livenessProbe:
            tcpSocket: { port: {{ .Values.webuiPort }} }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
        {{- if .Values.datasets }}
        {{- range .Values.datasets }}
        - name: ds-{{ .name }}
          {{- if .claim }}
          persistentVolumeClaim:
            claimName: {{ .claim }}
          {{- else }}
          hostPath:
            path: {{ .hostPath | quote }}
            type: Directory
          {{- end }}
        {{- end }}
        {{- else }}
        - name: data
          hostPath:
            path: {{ .Values.hostPath | quote }}
            type: Directory
        {{- end }}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: vuetorrent-init
          configMap:
            name: {{ .Release.Name }}-vuetorrent
            defaultMode: 0755
        {{- if .Values.vuetorrent }}
        - name: vuetorrent
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.webuiPort }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-vuetorrent
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  configure-downloads.sh: |
    #!/bin/bash
    set -eu
    conf=/config/qBittorrent/qBittorrent.conf
    mkdir -p /config/qBittorrent
    if [ ! -f "$conf" ]; then
      if [ -f /defaults/qBittorrent.conf ]; then
        cp /defaults/qBittorrent.conf "$conf"
      else
        touch "$conf"
      fi
    fi
    value=false
    if [ "${USE_CATEGORY_PATHS_IN_MANUAL_MODE:-true}" = "true" ]; then
      value=true
    fi
    if grep -q '^Session.UseCategoryPathsInManualMode=' "$conf"; then
      sed -i "s|^Session.UseCategoryPathsInManualMode=.*|Session\\\\UseCategoryPathsInManualMode=${value}|" "$conf"
    elif grep -q '^\[BitTorrent\]' "$conf"; then
      sed -i "/^\[BitTorrent\]/a Session\\\\UseCategoryPathsInManualMode=${value}" "$conf"
    else
      printf '\n[BitTorrent]\nSession\\UseCategoryPathsInManualMode=%s\n' "$value" >> "$conf"
    fi
    chown abc:abc "$conf" 2>/dev/null || true
  enable-vuetorrent.sh: |
    #!/bin/bash
    set -eu
    conf=/config/qBittorrent/qBittorrent.conf
    mkdir -p /config/qBittorrent
    if [ ! -f "$conf" ]; then
      if [ -f /defaults/qBittorrent.conf ]; then
        cp /defaults/qBittorrent.conf "$conf"
      else
        touch "$conf"
      fi
    fi
    sed -i '/^AlternativeUIEnabled=/d; /^RootFolder=/d' "$conf"
    if [ "${VUETORRENT_ENABLED:-false}" = "true" ]; then
      if grep -q '^\[WebUI\]' "$conf"; then
        sed -i '/^\[WebUI\]/a AlternativeUIEnabled=true' "$conf"
        sed -i '/^\[WebUI\]/a RootFolder=/vuetorrent' "$conf"
      else
        printf '\n[WebUI]\nAlternativeUIEnabled=true\nRootFolder=/vuetorrent\n' >> "$conf"
      fi
    fi
    chown abc:abc "$conf" 2>/dev/null || true


