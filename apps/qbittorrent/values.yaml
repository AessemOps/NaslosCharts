image:
  repository: lscr.io/linuxserver/qbittorrent
  tag: latest
  pullPolicy: IfNotPresent

vpnImage: qmcgaw/gluetun:latest
vpn_provider: ""            # e.g. protonvpn, mullvad, nordvpn, custom
vpn_type: wireguard         # wireguard | openvpn
vpn_serverCountries: ""
vpn_wireguardPrivateKey: ""
vpn_wireguardAddresses: ""
vpn_openvpnUser: ""
vpn_openvpnPassword: ""
# Subnets reachable outside the tunnel (cluster + LAN) so Radarr/Sonarr and
# Traefik can still talk to the WebUI.
vpn_firewallOutboundSubnets: "10.244.0.0/16,10.96.0.0/12,192.168.1.0/24"

timezone: Etc/UTC
puid: 1000
pgid: 1000
webuiPort: 8080

hostPath: /var/mnt

# Datasets attached by the platform: one entry per selected managed dataset,
# each mounted at /datasets/<name>. When empty, the chart keeps the hostPath
# fallback above.
datasets: []

persistence:
  config:
    size: 4Gi
    storageClass: ""

# The Service and container port both follow webuiPort.
service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi
