database_url: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgresPassword | urlquery }}@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}"
check_tables: true
domain: {{ .Values.domain | quote }}
https_only: false
use_pubsub_feeds: true
hmac_key: {{ .Values.hmacKey | quote }}
