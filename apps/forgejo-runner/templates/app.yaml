apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.data.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-docker
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.docker.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.docker.size }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  config.yml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: {{ .Values.runnerCapacity }}
      timeout: 3h
      labels: []
    cache:
      enabled: true
    container:
      privileged: false
      docker_host: "tcp://127.0.0.1:2375"
    host:
      workdir_parent: /data
    server:
      connections:
        forgejo:
          url: {{ .Values.instanceUrl | quote }}
          uuid: {{ .Values.runnerUuid | quote }}
          token: {{ .Values.runnerToken | quote }}
          labels:
            {{- range splitList "," (.Values.runnerLabels | default "docker:docker://node:20-bookworm") }}
            - {{ . | trim | quote }}
            {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        naslos.io/env-checksum: {{ .Values.naslosEnvChecksum | default "" | quote }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: dind
          image: "{{ .Values.dindImage }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
          volumeMounts:
            - { name: docker, mountPath: /var/lib/docker }
          readinessProbe:
            exec:
              command: ["docker", "info"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.dind | nindent 12 }}
        - name: runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: naslos-env-{{ .Release.Name }}, optional: true }
          command: ["forgejo-runner", "daemon", "--config", "/etc/forgejo-runner/config.yml"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - { name: TZ, value: "{{ .Values.timezone }}" }
            - { name: DOCKER_HOST, value: "tcp://127.0.0.1:2375" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/forgejo-runner/config.yml, subPath: config.yml, readOnly: true }
          resources:
            {{- toYaml .Values.resources.runner | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: docker
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-docker
        - name: config
          secret:
            secretName: {{ .Release.Name }}-config
