image:
  repository: ghcr.io/bitmagnet-io/bitmagnet
  tag: latest
  pullPolicy: IfNotPresent

timezone: Etc/UTC
postgresPassword: bitmagnet-change-me
tmdbApiKey: ""

postgres:
  image: postgres:16-alpine
  user: postgres
  database: bitmagnet
  persistence:
    size: 10Gi
    storageClass: ""

persistence:
  config:
    size: 1Gi
    storageClass: ""

service:
  port: 3333
  torrentPort: 3334

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi
