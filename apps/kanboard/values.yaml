image:
  repository: kanboard/kanboard
  tag: latest
  pullPolicy: IfNotPresent

persistence:
  # SQLite database, uploads and application data.
  data:
    size: 2Gi
    storageClass: ""
  # Installed plugins.
  plugins:
    size: 1Gi
    storageClass: ""

service:
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
