name: paperless-ngx
displayName: Paperless-ngx
description: Scan, index and archive documents with OCR and full-text search.
category: productivity
icon: "P"
website: https://docs.paperless-ngx.com
version: 0.1.0
capabilities: [env]
tags: [documents, ocr, archive]
schema:
  type: object
  properties:
    siteUrl:
      type: string
      title: Public URL
      description: URL users open, e.g. https://paperless.example.com
      default: http://localhost:8000
    secretKey:
      type: string
      title: Application secret key
      format: password
      description: Secret used by Django to sign sessions and tokens.
      default: paperless-change-me
    postgresPassword:
      type: string
      title: Database password
      format: password
      description: Password for the bundled PostgreSQL database.
      default: paperless-change-me
    adminUser:
      type: string
      title: Admin username
      description: Superuser created on the first start with an empty database.
      default: admin
    adminPassword:
      type: string
      title: Admin password
      format: password
      description: Superuser password created on the first start with an empty database.
      default: paperless-change-me
    ocrLanguage:
      type: string
      title: OCR language
      description: Tesseract language code used for OCR, e.g. eng or deu+eng.
      default: eng
    timezone:
      type: string
      title: Timezone
      default: Etc/UTC
  required: [siteUrl, secretKey, postgresPassword, adminUser, adminPassword]
defaultValues:
  siteUrl: http://localhost:8000
  secretKey: paperless-change-me
  postgresPassword: paperless-change-me
  adminUser: admin
  adminPassword: paperless-change-me
  ocrLanguage: eng
  timezone: Etc/UTC
services:
  - name: "{{ .Release.Name }}"
    port: 8000
    scheme: http
exposure:
  subdomain: paperless
  tls: true
  auth: false
  localOnly: false
  internet: true
