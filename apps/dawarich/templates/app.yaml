---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image }}"
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_DB, value: "{{ .Values.postgres.database }}" }
            - { name: POSTGRES_USER, value: "{{ .Values.postgres.user }}" }
            - { name: POSTGRES_PASSWORD, value: "{{ .Values.databasePassword }}" }
            - { name: TZ, value: "{{ .Values.timezone }}" }
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: postgres-data, mountPath: /var/lib/postgresql/data }
            - { name: dshm, mountPath: /dev/shm }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-postgres
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image }}"
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "900", "1"]
          ports:
            - { name: redis, containerPort: 6379 }
          volumeMounts:
            - { name: redis-data, mountPath: /data }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-redis
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      annotations:
        naslos.io/env-checksum: {{ .Values.naslosEnvChecksum | default "" | quote }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: app
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # Kubernetes does not copy image content into a fresh PVC the way
        # Docker does for a named volume. Seed the compiled Rails assets from
        # the image before the app mounts the public volume.
        - name: seed-public
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp -a /var/app/public/. /seed/
          volumeMounts:
            - { name: public, mountPath: /seed }
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: dawarich
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: naslos-env-{{ .Release.Name }}, optional: true }
          command: ["web-entrypoint.sh"]
          args: ["bin/rails", "server", "-p", "3000", "-b", "0.0.0.0"]
          env:
            - { name: RAILS_ENV, value: "production" }
            - { name: RAILS_LOG_TO_STDOUT, value: "true" }
            - { name: REDIS_URL, value: "redis://{{ .Release.Name }}-redis:6379" }
            - { name: DATABASE_HOST, value: "{{ .Release.Name }}-postgres" }
            - { name: DATABASE_PORT, value: "5432" }
            - { name: DATABASE_USERNAME, value: "{{ .Values.postgres.user }}" }
            - { name: DATABASE_PASSWORD, value: {{ .Values.databasePassword | quote }} }
            - { name: DATABASE_NAME, value: "{{ .Values.postgres.database }}" }
            - { name: APPLICATION_HOSTS, value: {{ .Values.applicationHosts | quote }} }
            - { name: APPLICATION_PROTOCOL, value: {{ .Values.applicationProtocol | quote }} }
            - { name: TIME_ZONE, value: "{{ .Values.timezone }}" }
            - { name: SECRET_KEY_BASE, value: {{ .Values.secretKeyBase | quote }} }
            - { name: SELF_HOSTED, value: "true" }
            - { name: SIDEKIQ_EMBEDDED, value: "true" }
            - { name: WEB_CONCURRENCY, value: "0" }
          ports:
            - { name: http, containerPort: 3000 }
          volumeMounts:
            - { name: public, mountPath: /var/app/public }
            - { name: storage, mountPath: /var/app/storage }
            - { name: watched, mountPath: /var/app/tmp/imports/watched }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 3000 }
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: public
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-public
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-storage
        - name: watched
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-watched
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 3000
