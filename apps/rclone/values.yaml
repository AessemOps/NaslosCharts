image:
  repository: rclone/rclone
  tag: latest
  pullPolicy: IfNotPresent

# Web GUI / RC API credentials.
rcUser: admin
rcPassword: rclone-change-me

persistence:
  config:
    size: 2Gi
    storageClass: ""

service:
  port: 5572

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi
