image:
  repository: lscr.io/linuxserver/radarr
  tag: latest
  pullPolicy: IfNotPresent

timezone: Etc/UTC
puid: 1000
pgid: 1000

# PVC providing the Naslos datasets root (the platform's `naslos-datasets`).
# Put movies and downloads under it so Radarr can hardlink/atomic-move.
datasetsClaim: naslos-datasets

persistence:
  config:
    size: 4Gi
    storageClass: ""

service:
  port: 7878

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi
