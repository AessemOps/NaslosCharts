name: radarr
displayName: Radarr
description: Movie collection manager for Usenet and BitTorrent.
category: media
icon: "Ra"
website: https://radarr.video
version: 0.1.0
tags: [media, movies, automation]
schema:
  type: object
  properties:
    timezone:
      type: string
      title: Timezone
      default: Etc/UTC
    puid:
      type: integer
      title: PUID
      default: 1000
    pgid:
      type: integer
      title: PGID
      default: 1000
  required: [timezone, puid, pgid]
defaultValues:
  timezone: Etc/UTC
  puid: 1000
  pgid: 1000
services:
  - name: "{{ .Release.Name }}"
    port: 7878
    scheme: http
exposure:
  subdomain: radarr
  tls: false
  auth: false
  localOnly: false
