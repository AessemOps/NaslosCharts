name: radarr
displayName: Radarr
description: Movie collection manager for Usenet and BitTorrent.
category: media
icon: "Ra"
website: https://radarr.video
version: 0.1.6
capabilities: [env]
tags: [media, movies, automation]
schema:
  type: object
  properties:
    timezone:
      type: string
      title: Timezone
      default: Etc/UTC
    puid:
      type: integer
      title: PUID
      default: 1000
    pgid:
      type: integer
      title: PGID
      default: 1000
    disableAuth:
      type: boolean
      title: Disable app authentication
      description: Rely on Authelia forward-auth; the app will not ask for its own login.
      default: true
  required: [timezone, puid, pgid]
defaultValues:
  timezone: Etc/UTC
  puid: 1000
  pgid: 1000
  disableAuth: true
services:
  - name: "{{ .Release.Name }}"
    port: 7878
    scheme: http
exposure:
  subdomain: radarr
  tls: false
  auth: true
  localOnly: false
  internet: true
