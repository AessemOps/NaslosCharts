apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.config.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.config.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-ssh
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.ssh.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.ssh.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-ssh-host
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.sshHost.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.sshHost.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-repos
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.repos.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.repos.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        naslos.io/env-checksum: {{ .Values.naslosEnvChecksum | default "" | quote }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: {{ .Values.pgid }}
      containers:
        - name: borgwarehouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: naslos-env-{{ .Release.Name }}, optional: true }
          env:
            - { name: PUID, value: "{{ .Values.puid }}" }
            - { name: PGID, value: "{{ .Values.pgid }}" }
            - { name: TZ, value: "{{ .Values.timezone }}" }
            - { name: FQDN, value: "{{ .Values.fqdn }}" }
            - { name: BETTER_AUTH_URL, value: "{{ .Values.authUrl }}" }
            - { name: BETTER_AUTH_SECRET, value: "{{ .Values.authSecret }}" }
            - { name: SSH_SERVER_PORT, value: "{{ .Values.sshPort }}" }
            {{- with .Values.setupSecret }}
            - { name: SETUP_SECRET, value: {{ . | quote }} }
            {{- end }}
          ports:
            - { name: http, containerPort: 3000 }
            - { name: ssh, containerPort: {{ .Values.sshPort }} }
          volumeMounts:
            - { name: config, mountPath: /home/borgwarehouse/app/config }
            - { name: ssh, mountPath: /home/borgwarehouse/.ssh }
            - { name: ssh-host, mountPath: /etc/ssh }
            - { name: repos, mountPath: /home/borgwarehouse/repos }
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-config
        - name: ssh
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-ssh
        - name: ssh-host
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-ssh-host
        - name: repos
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-repos
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: ssh
      port: {{ .Values.sshPort }}
      targetPort: {{ .Values.sshPort }}
