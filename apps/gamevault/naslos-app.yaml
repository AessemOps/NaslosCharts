name: gamevault
displayName: GameVault
description: Self-hosted game library and download server for DRM-free games.
category: media
icon: "GV"
website: https://gamevau.lt
version: 0.1.0
tags: [games, library, media]
schema:
  type: object
  properties:
    timezone:
      type: string
      title: Timezone
      default: Etc/UTC
    puid:
      type: integer
      title: PUID
      default: 1000
    pgid:
      type: integer
      title: PGID
      default: 1000
    adminUsername:
      type: string
      title: Initial admin username
      default: admin
    adminPassword:
      type: string
      title: Initial admin password
      format: password
      default: admin-change-me
    registrationDisabled:
      type: boolean
      title: Disable registration
      description: Prevent new users from registering themselves.
      default: false
  required: [timezone, puid, pgid, adminUsername, adminPassword]
defaultValues:
  timezone: Etc/UTC
  puid: 1000
  pgid: 1000
  adminUsername: admin
  adminPassword: admin-change-me
  registrationDisabled: false
services:
  - name: "{{ .Release.Name }}"
    port: 8080
    scheme: http
exposure:
  subdomain: gamevault
  tls: true
  auth: false
  localOnly: false
  internet: true
