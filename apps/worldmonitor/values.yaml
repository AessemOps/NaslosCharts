image:
  repository: ghcr.io/koala73/worldmonitor-selfhosted
  tag: main
  pullPolicy: IfNotPresent

aisRelay:
  image: ghcr.io/koala73/worldmonitor-ais-relay:main

redisRest:
  image: ghcr.io/koala73/worldmonitor-redis-rest:main

redis:
  image: redis:7-alpine
  persistence:
    size: 2Gi
    storageClass: ""

timezone: Etc/UTC

# REDIS_PASSWORD and REDIS_TOKEN from the upstream compose file. The token is
# shared by the app, the AIS relay and the Redis REST proxy; the password is
# the Redis server's --requirepass value.
redisPassword: worldmonitor-redis-change-me
redisToken: worldmonitor-token-change-me
relaySharedSecret: worldmonitor-relay-change-me
sessionSecret: worldmonitor-session-change-me-please

service:
  port: 3000

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi
