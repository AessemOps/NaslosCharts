apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.config.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.config.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: {{ .Values.pgid }}
      # gluetun establishes the tunnel and the pod's default route; prowlarr
      # shares the pod network namespace, so its traffic exits through the VPN.
      containers:
        - name: gluetun
          image: "{{ .Values.vpn.image }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - { name: VPN_SERVICE_PROVIDER, value: "{{ .Values.vpn.provider }}" }
            - { name: VPN_TYPE, value: "{{ .Values.vpn.type }}" }
            - { name: SERVER_COUNTRIES, value: "{{ .Values.vpn.serverCountries }}" }
            - { name: WIREGUARD_PRIVATE_KEY, value: "{{ .Values.vpn.wireguardPrivateKey }}" }
            - { name: WIREGUARD_ADDRESSES, value: "{{ .Values.vpn.wireguardAddresses }}" }
            - { name: OPENVPN_USER, value: "{{ .Values.vpn.openvpnUser }}" }
            - { name: OPENVPN_PASSWORD, value: "{{ .Values.vpn.openvpnPassword }}" }
            - { name: FIREWALL_OUTBOUND_SUBNETS, value: "{{ .Values.vpn.firewallOutboundSubnets }}" }
            - { name: TZ, value: "{{ .Values.timezone }}" }
          volumeMounts:
            - { name: tun, mountPath: /dev/net/tun }
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 15
        - name: prowlarr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: PUID, value: "{{ .Values.puid }}" }
            - { name: PGID, value: "{{ .Values.pgid }}" }
            - { name: TZ, value: "{{ .Values.timezone }}" }
          ports:
            - { name: http, containerPort: 9696 }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: 9696 }
            initialDelaySeconds: 20
            periodSeconds: 20
          livenessProbe:
            tcpSocket: { port: 9696 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
        - name: data
          hostPath:
            path: {{ .Values.hostPath | quote }}
            type: Directory
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9696
      targetPort: 9696
