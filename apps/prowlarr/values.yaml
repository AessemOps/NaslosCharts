image:
  repository: lscr.io/linuxserver/prowlarr
  tag: latest
  pullPolicy: IfNotPresent

# gluetun is the VPN sidecar; the app shares its network namespace.
vpnImage: qmcgaw/gluetun:latest
vpn_provider: ""            # e.g. protonvpn, mullvad, nordvpn, custom
vpn_type: wireguard         # wireguard | openvpn
vpn_serverCountries: ""
vpn_wireguardPrivateKey: ""
vpn_wireguardAddresses: ""
vpn_openvpnUser: ""
vpn_openvpnPassword: ""
# Subnets the app is allowed to reach outside the tunnel (cluster + LAN).
# Inbound to the WebUI is allowed separately via FIREWALL_INPUT_PORTS.
vpn_firewallOutboundSubnets: "10.244.0.0/16,10.96.0.0/12,192.168.1.0/24"

timezone: Etc/UTC
puid: 1000
pgid: 1000

# Disable the app's own login and rely on Authelia forward-auth.
disableAuth: true

# FlareSolverr runs as a sidecar in the Prowlarr pod. Cloudflare clearance
# cookies are bound to the client IP, and Prowlarr re-issues indexer requests
# with the solver's cookies, so the solver must egress through the same
# gluetun tunnel as Prowlarr.
flaresolverr:
  enabled: true
  image:
    repository: ghcr.io/flaresolverr/flaresolverr
    tag: latest
    pullPolicy: IfNotPresent
  logLevel: info
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

hostPath: /var/mnt

# Datasets attached by the platform: one entry per selected managed dataset,
# each mounted at /datasets/<name>. When empty, the chart keeps the hostPath
# fallback above.
datasets: []

persistence:
  config:
    size: 2Gi
    storageClass: ""

service:
  port: 9696

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi
