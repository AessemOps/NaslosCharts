apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.config.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.config.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        naslos.io/env-checksum: {{ .Values.naslosEnvChecksum | default "" | quote }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: {{ .Values.pgid }}
      containers:
        - name: calibre-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: naslos-env-{{ .Release.Name }}, optional: true }
          env:
            - { name: PUID, value: "{{ .Values.puid }}" }
            - { name: PGID, value: "{{ .Values.pgid }}" }
            - { name: TZ, value: "{{ .Values.timezone }}" }
          ports:
            - { name: http, containerPort: 8083 }
          volumeMounts:
            - { name: config, mountPath: /config }
            {{- if .Values.datasets }}
            {{- range .Values.datasets }}
            - { name: ds-{{ .name }}, mountPath: {{ .mountPath }} }
            {{- end }}
            {{- else }}
            - { name: books, mountPath: /books }
            {{- end }}
          readinessProbe:
            tcpSocket: { port: 8083 }
            initialDelaySeconds: 15
            periodSeconds: 20
          livenessProbe:
            tcpSocket: { port: 8083 }
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
        {{- if .Values.datasets }}
        {{- range .Values.datasets }}
        - name: ds-{{ .name }}
          {{- if .claim }}
          persistentVolumeClaim:
            claimName: {{ .claim }}
          {{- else }}
          hostPath:
            path: {{ .hostPath | quote }}
            type: Directory
          {{- end }}
        {{- end }}
        {{- else }}
        - name: books
          persistentVolumeClaim:
            claimName: {{ .Values.datasetsClaim }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8083
      targetPort: 8083
