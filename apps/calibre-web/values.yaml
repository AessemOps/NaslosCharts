image:
  repository: lscr.io/linuxserver/calibre-web
  tag: latest
  pullPolicy: IfNotPresent

timezone: Etc/UTC
puid: 1000
pgid: 1000

# PVC providing the Naslos datasets root (the platform's `naslos-datasets`),
# mounted at /books.
datasetsClaim: naslos-datasets

# Datasets attached by the platform: one entry per selected managed dataset,
# each mounted at /datasets/<name>. When empty, the chart keeps the shared
# datasetsClaim fallback above.
datasets: []

persistence:
  config:
    size: 2Gi
    storageClass: ""

service:
  port: 8083

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi
