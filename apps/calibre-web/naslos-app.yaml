name: calibre-web
displayName: Calibre-Web
description: Browse, read and manage your Calibre e-book library from a browser.
category: media
icon: "C"
website: https://github.com/janeczku/calibre-web
version: 0.1.0
tags: [books, library]
schema:
  type: object
  properties:
    timezone:
      type: string
      title: Timezone
      default: Etc/UTC
    puid:
      type: integer
      title: PUID
      default: 1000
    pgid:
      type: integer
      title: PGID
      default: 1000
    hostPath:
      type: string
      title: Library host path
      description: Host directory (a Naslos dataset) mounted at /books.
      default: /var/mnt
  required: [timezone, puid, pgid, hostPath]
defaultValues:
  timezone: Etc/UTC
  puid: 1000
  pgid: 1000
  hostPath: /var/mnt
services:
  - name: "{{ .Release.Name }}"
    port: 8083
    scheme: http
exposure:
  subdomain: calibre
  tls: false
  auth: true
  localOnly: false
