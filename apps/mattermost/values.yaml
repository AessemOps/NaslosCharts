image:
  repository: mattermost/mattermost-team-edition
  tag: latest
  pullPolicy: IfNotPresent

# Public base URL of the server.
siteUrl: http://localhost:8065

# Password for the bundled PostgreSQL user.
postgresPassword: mattermost-change-me

postgres:
  image: postgres:16-alpine
  database: mattermost
  user: mattermost
  persistence:
    size: 10Gi
    storageClass: ""

persistence:
  config:
    size: 1Gi
    storageClass: ""
  # User uploads, avatars and other file attachments.
  data:
    size: 20Gi
    storageClass: ""
  logs:
    size: 2Gi
    storageClass: ""
  plugins:
    size: 1Gi
    storageClass: ""
  clientPlugins:
    size: 1Gi
    storageClass: ""

service:
  port: 8065

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
