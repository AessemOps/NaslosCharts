image:
  repository: ghcr.io/advplyr/audiobookshelf
  tag: latest
  pullPolicy: IfNotPresent

timezone: Etc/UTC
puid: 1000
pgid: 1000

# Host directory (a Naslos dataset) holding your audiobooks, mounted at /audiobooks.
hostPath: /var/mnt

persistence:
  config:
    size: 2Gi
    storageClass: ""
  metadata:
    size: 2Gi
    storageClass: ""

service:
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi
