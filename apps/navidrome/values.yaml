image:
  repository: deluan/navidrome
  tag: latest
  pullPolicy: IfNotPresent

timezone: Etc/UTC

# How often the library scanner runs. Accepts a Go duration or a cron
# expression, e.g. "@every 24h" or "0 */6 * * *".
scanSchedule: "@every 24h"

# PVC providing the Naslos datasets root (the platform's `naslos-datasets`),
# mounted read-only at /music.
datasetsClaim: naslos-datasets

# Datasets attached by the platform: one entry per selected managed dataset,
# each mounted at /datasets/<name>. When empty, the chart keeps the shared
# datasetsClaim fallback above.
datasets: []

persistence:
  # SQLite database, artwork cache and transcode cache.
  data:
    size: 2Gi
    storageClass: ""

service:
  port: 4533

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
