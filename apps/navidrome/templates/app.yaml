apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.data.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        naslos.io/env-checksum: {{ .Values.naslosEnvChecksum | default "" | quote }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: navidrome
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: naslos-env-{{ .Release.Name }}, optional: true }
          env:
            - { name: TZ, value: "{{ .Values.timezone }}" }
            - { name: ND_MUSICFOLDER, value: "{{ if .Values.datasets }}/datasets{{ else }}/music{{ end }}" }
            - { name: ND_DATAFOLDER, value: "/data" }
            - { name: ND_SCANSCHEDULE, value: {{ .Values.scanSchedule | quote }} }
            - { name: ND_LOGLEVEL, value: "info" }
          ports:
            - { name: http, containerPort: 4533 }
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- if .Values.datasets }}
            {{- range .Values.datasets }}
            - { name: ds-{{ .name }}, mountPath: {{ .mountPath }} }
            {{- end }}
            {{- else }}
            - { name: music, mountPath: /music, readOnly: true }
            {{- end }}
          readinessProbe:
            tcpSocket: { port: 4533 }
            initialDelaySeconds: 15
            periodSeconds: 20
          livenessProbe:
            tcpSocket: { port: 4533 }
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- if .Values.datasets }}
        {{- range .Values.datasets }}
        - name: ds-{{ .name }}
          {{- if .claim }}
          persistentVolumeClaim:
            claimName: {{ .claim }}
          {{- else }}
          hostPath:
            path: {{ .hostPath | quote }}
            type: Directory
          {{- end }}
        {{- end }}
        {{- else }}
        - name: music
          persistentVolumeClaim:
            claimName: {{ .Values.datasetsClaim }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 4533
