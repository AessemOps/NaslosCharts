apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        naslos.io/env-checksum: {{ .Values.naslosEnvChecksum | default "" | quote }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: {{ .Values.pgid }}
      containers:
        - name: gameyfin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: naslos-env-{{ .Release.Name }}, optional: true }
          env:
            - { name: PUID, value: "{{ .Values.puid }}" }
            - { name: PGID, value: "{{ .Values.pgid }}" }
            - { name: TZ, value: "{{ .Values.timezone }}" }
            - { name: APP_KEY, value: "{{ .Values.appKey }}" }
            - { name: APP_URL, value: "{{ .Values.appUrl }}" }
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: db, mountPath: /opt/gameyfin/db }
            - { name: data, mountPath: /opt/gameyfin/data }
            - { name: backups, mountPath: /opt/gameyfin/backups }
            - { name: plugindata, mountPath: /opt/gameyfin/plugindata }
            - { name: plugins, mountPath: /opt/gameyfin/plugins-installed }
            - { name: logs, mountPath: /opt/gameyfin/logs }
            {{- if .Values.datasets }}
            {{- range .Values.datasets }}
            - { name: ds-{{ .name }}, mountPath: {{ .mountPath }} }
            {{- end }}
            {{- else }}
            - { name: games, mountPath: /games }
            {{- end }}
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 180
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-db
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: backups
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-backups
        - name: plugindata
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-plugindata
        - name: plugins
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-plugins
        - name: logs
          emptyDir: {}
        {{- if .Values.datasets }}
        {{- range .Values.datasets }}
        - name: ds-{{ .name }}
          {{- if .claim }}
          persistentVolumeClaim:
            claimName: {{ .claim }}
          {{- else }}
          hostPath:
            path: {{ .hostPath | quote }}
            type: Directory
          {{- end }}
        {{- end }}
        {{- else }}
        - name: games
          persistentVolumeClaim:
            claimName: {{ .Values.datasetsClaim }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
