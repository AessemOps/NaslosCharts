apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  settings.yml: |
{{ include "searxng.settings" . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-templates
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  patch-templates.py: |
{{ .Files.Get "files/patch-templates.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        naslos.io/env-checksum: {{ .Values.naslosEnvChecksum | default "" | quote }}
        checksum/config: {{ include "searxng.settings" . | sha256sum }}
        checksum/templates: {{ .Files.Get "files/patch-templates.py" | sha256sum }}
    spec:
      initContainers:
        - name: patch-templates
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/searxng/.venv/bin/python", "/patch/patch-templates.py"]
          env:
            - name: AUTH_COOKIE
              value: {{ .Values.authCookie | quote }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - { name: templates, mountPath: /templates }
            - { name: templates-patch, mountPath: /patch, readOnly: true }
      containers:
        - name: searxng
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef: { name: naslos-env-{{ .Release.Name }}, optional: true }
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: config, mountPath: /etc/searxng, readOnly: true }
            - { name: cache, mountPath: /var/cache/searxng }
            - { name: templates, mountPath: /templates, readOnly: true }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}
        - name: cache
          emptyDir: {}
        - name: templates
          emptyDir: {}
        - name: templates-patch
          configMap:
            name: {{ .Release.Name }}-templates
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
