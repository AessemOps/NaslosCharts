image:
  repository: ghcr.io/johnrbrady/byb-budget
  tag: latest
  pullPolicy: IfNotPresent

timezone: Etc/UTC
sessionTtlHours: 72
# Optional n8n integration.
apiKey: ""
webhookUrl: ""

persistence:
  data:
    size: 2Gi
    storageClass: ""

service:
  port: 3001

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: "500m"
    memory: 512Mi
