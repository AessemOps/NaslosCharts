image:
  repository: nousresearch/hermes-agent
  tag: latest
  pullPolicy: IfNotPresent

timezone: Etc/UTC

# Optional bearer token for the OpenAI-compatible gateway API. When set, the
# chart also enables API_SERVER_ENABLED and binds API_SERVER_HOST to 0.0.0.0 so
# port 8642 is reachable from the Service. Leave empty to keep the API server
# off.
apiServerKey: ""

# The dashboard binds 0.0.0.0. Upstream refuses a non-loopback dashboard bind
# unless Hermes has its own auth provider (basic auth, Nous OAuth or OIDC);
# Authelia protects the HTTP route but does not satisfy that internal check.
# If the dashboard service logs a missing-provider error, add
# HERMES_DASHBOARD_BASIC_AUTH_USERNAME/_PASSWORD/_SECRET (or the OIDC
# equivalents) through the app's environment variables.

persistence:
  # Hermes home: profiles, config.yaml, .env, logs and agent state.
  data:
    size: 10Gi
    storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 4Gi
