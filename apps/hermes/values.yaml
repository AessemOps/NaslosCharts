image:
  repository: nousresearch/hermes-agent
  tag: latest
  pullPolicy: IfNotPresent

timezone: Etc/UTC

# Optional bearer token for the OpenAI-compatible gateway API. When set, the
# chart also enables API_SERVER_ENABLED and binds API_SERVER_HOST to 0.0.0.0 so
# port 8642 is reachable from the Service. Leave empty to keep the API server
# off.
apiServerKey: ""

# Built-in dashboard basic-auth provider. Hermes requires its own auth provider
# on a non-loopback bind; Authelia alone does not satisfy that internal gate.
dashboardUsername: admin
dashboardPassword: hermes-change-me
dashboardSecret: hermes-dashboard-change-me

persistence:
  # Hermes home: profiles, config.yaml, .env, logs and agent state.
  data:
    size: 10Gi
    storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 4Gi
